      - icon: github
        href: https://github.com/chloemjones13/5000_Final_Project
    left:
      - href: landing.qmd
        text: Home
      - href: aboutMe.qmd
        text: About Me
      - href: report/report.qmd
        text: Report
      - text: "Technical Details"
        menu:
          - href: technical-details/data-collection/main.ipynb
            text: Data Collection
